[workspace]
members = [
  "tento-env",
  "tento-env/tento-env-macros",
  "tento-chrono",
  "tento-chrono/bindings",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.94"
colored = "2.2.0"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }

[patch.crates-io]
iana-time-zone = { path = "vendor/iana-time-zone" }
